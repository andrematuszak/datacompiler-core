[build-system]
requires = ["setuptools>=42", "wheel", "nuitka", "toml"]
build-backend = "nuitka.distutils.Build"

[tool.nuitka]
include-package = "datacompiler"
nofollow-import-to = [
    "pymupdf",
    "pdfplumber",
    "paddleocr",
    "paddle",
    "torch",
    "cv2",
    "numpy",
    "PIL",
    "pytest",
    "*.tests",
    "*.distutils",
]   

[project]
name = "datacompiler"
version = "0.1.0"
description = "Pipeline d'extraction, diagnostic, OCR multi-moteurs et compilation/rendu de documents PDF."
readme = "README.md"
license = "LicenseRef-DataCompiler-CLUF"
license-files = ["LICENSE", "LICENSE-EMBEDDED"]
requires-python = ">=3.11"

# Dépendances de base obligatoires (incluant Paddle, Docx, Fonttools, etc.)
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "numpy>=1.24.0",
    "reportlab>=4.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pdf2image",
    "python-docx>=1.1.0",
    "paddlepaddle>=2.5.0",
    "paddleocr>=2.7.0",
    "mistralai>=1.0.0",
    "transformers==4.49.0",
    "torch",
    "timm",
    "einops",
    "fonttools"
]

[project.urls]
Homepage = "https://data-compiler.com"
Repository = "https://github.com/andrematuszak/datacompiler"
Documentation = "https://github.com/andrematuszak/datacompiler#readme"

[project.optional-dependencies]
# Outils de développement et tests uniquement
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy"
]

[project.scripts]
datacompiler = "datacompiler.pipeline:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datacompiler = ["backend/fonts/*.ttf"]