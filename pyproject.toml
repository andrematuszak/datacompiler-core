[build-system]
requires = ["nuitka[build-wheel]", "toml"]
build-backend = "nuitka.distutils.Build"

[tool.nuitka]
python-flag = "no_docstrings,no_asserts"
enable-plugin = "numpy"
remove-output = true
nofollow-import-to = [
    "pymupdf",
    "pdfplumber",
    "paddleocr",
    "paddle",
    "torch",
    "cv2",
    "numpy",
    "PIL",
    "pytest",
    "*.tests",
    "*.distutils",
]   

[project]
name = "datacompiler"
dynamic = ["version"]
description = "Nettoyage et reconstruction géométrique fidèle de fichiers PDF"
readme = "README.md"
license = "LicenseRef-DataCompiler-CLUF"
license-files = ["LICENSE", "LICENSE-EMBEDDED"]
requires-python = ">=3.11"

# Dépendances de base obligatoires, dont PaddlePaddle/PaddleOCR pour le parcours reconstruit.
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "numpy>=1.24.0",
    "Pillow>=10.0",
    "paddlepaddle",
    "paddleocr",
    "python-docx>=1.1.0",
    "fonttools",
    "langdetect>=1.0.9"
]

[project.urls]
Homepage = "https://data-compiler.com"
Repository = "https://github.com/andrematuszak/datacompiler-core"
Documentation = "https://github.com/andrematuszak/datacompiler-core#readme"

[project.optional-dependencies]
# PaddleOCR is the default mode.
# However, some models work better depending on the type of document
# Mistral is now paid
mistral = [
    "mistralai"
]
# Qwen2.5-VL is also paid
qwen = [
    "accelerate>=0.26.0",
    "transformers==4.49.0",
    "torch",
    "timm",
    "einops"
]

# OpenRouter offers free access to 3 models: nvidia/nemotron-3.5-super-vl:free
openai = [
    "openai"
]

# Hosted DeepL text translation (requires a DeepL API key).
translation = [
    "deepl>=1.26.0"
]
# Local COMETKiwi reference-free quality estimation (large ML dependencies).
translation-quality = [
    "unbabel-comet"
]
# Export au format Word
docx = [
    "python-docx>=1.1.0"
]
# Outils de dev et tests
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "jsonschema>=4.20"
]
# Groupe pour tout installer en une commande
all = [
    "mistralai>=1.0.0",
    "openai",
    "python-docx>=1.1.0",
    "accelerate>=0.26.0",
    "transformers==4.49.0",
    "torch",
    "timm",
    "einops"
]

[project.scripts]
datacompiler = "datacompiler.pipeline:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "datacompiler._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datacompiler = ["backend/fonts/*.ttf", "backend/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
