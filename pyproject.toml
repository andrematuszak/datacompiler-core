[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datacompiler"
dynamic = ["version"]
description = "Nettoyage et reconstruction géométrique fidèle de fichiers PDF"
readme = "README.md"
requires-python = ">=3.11"

# Dépendances de base obligatoires
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "numpy>=1.24.0",
    "reportlab",
    "Pillow>=10.0",
    "pdf2image",
    "python-docx>=1.1.0",
    "pytest>=7.0.0",
    "transformers==4.49.0",
    "torch",
    "timm",
    "einops",
    "fonttools"
]

[project.optional-dependencies]
# Moteurs OCR (Mistral, PaddleOCR)
ocr = [
    "accelerate>=0.26.0",
    "mistralai>=1.0.0",
    "paddlepaddle",
    "paddleocr"
]
# Export au format Word
docx = [
    "python-docx>=1.1.0"
]
# Outils de dev et tests
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "jsonschema>=4.20"
]
# Groupe pour tout installer en une commande
all = [
    "mistralai>=1.0.0",
    "Pillow>=10.0",
    "paddlepaddle",
    "paddleocr",
    "python-docx>=1.1.0",
    "pytest>=7.0.0"
]

[project.scripts]
datacompiler = "datacompiler.pipeline:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "datacompiler._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datacompiler = ["backend/fonts/*.ttf", "backend/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
